name: Rust Port

on:
  pull_request:
    branches: [tsp-rust]
  push:
    branches: [tsp-rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
          cache: true
          cache-workspaces: crates -> target

      - name: Check formatting
        run: cargo fmt --check
        working-directory: crates

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates

      - name: Run Rust tests
        run: cargo test
        working-directory: crates

  napi-build:
    name: napi build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup
        with:
          node-version: 24.x

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
          cache: true
          cache-workspaces: crates -> target

      - name: Install dependencies
        run: pnpm install

      # The standard library (M10) imports `@typespec/compiler`'s built `dist/**/tsp-index.js`; the M11
      # decorator comparison tests also run `@typespec/http`'s built implementations and the M12
      # emitter tests run `@typespec/json-schema` (and `@typespec/asset-emitter`).
      - name: Build @typespec/compiler-rust dependencies
        run: pnpm -r --filter "@typespec/compiler-rust^..." build

      - name: Build native module
        run: pnpm -C packages/compiler-rust build

      - name: Test native module
        run: pnpm -C packages/compiler-rust test

      # M13: run the compiler's CLI e2e suite through `tsp compile` with the Rust checker enabled.
      - name: Compiler CLI e2e with the Rust checker
        run: pnpm -C packages/compiler exec vitest run --config ./vitest.config.e2e.ts test/e2e/cli
        env:
          TYPESPEC_USE_RUST_CHECKER: "1"
