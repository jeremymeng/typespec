[package]
name = "typespec-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
typespec-scanner = { path = "../typespec-scanner" }
typespec-parser = { path = "../typespec-parser" }
typespec-checker = { path = "../typespec-checker" }
typespec-source = { path = "../typespec-source" }

[build-dependencies]
napi-build = "2"
